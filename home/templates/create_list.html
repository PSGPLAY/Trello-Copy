{% extends "base.html" %}
{% load static %}

{% block title %}Create List · {{ board.name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="modal-content modal-content-dark p-4">
                <div class="d-flex align-items-center gap-2 mb-3">
                    <i class="bi bi-layout-three-columns text-primary fs-4"></i>
                    <h4 class="fw-bold text-white mb-0">Create New List</h4>
                </div>
                <p class="text-secondary small mb-4">Add a new workflow column to <strong>{{ board.name }}</strong></p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label text-light small fw-semibold">List Title</label>
                        {{ form.name }}
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4 fw-bold">Create List</button>
                        <a href="{% url 'home:board_detail' board.id %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
